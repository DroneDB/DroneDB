name: vcpkg binary cache
description: >
  Restore the vcpkg binary cache (built port archives) and point vcpkg at it.
  Pair it with ./.github/actions/vcpkg-binary-cache-save right after the step that
  runs vcpkg install, when `cache-hit` is not 'true'.

outputs:
  path:
    description: Directory that holds the vcpkg binary archives
    value: ${{ steps.vars.outputs.path }}
  key:
    description: Exact cache key for this manifest, triplet and vcpkg version
    value: ${{ steps.vars.outputs.key }}
  partial-key:
    description: Key for the ports built by an install that did not finish (restored before any other match)
    value: ${{ steps.vars.outputs.key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
  cache-hit:
    description: "'true' when the exact key was restored"
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Compute vcpkg binary cache key
      id: vars
      shell: bash
      run: |
        # Forward slashes: vcpkg reads VCPKG_BINARY_SOURCES the same way on Windows and Linux.
        dir="${GITHUB_WORKSPACE//\\//}/vcpkg-bincache"
        mkdir -p "$dir"
        # The vcpkg submodule commit pins the port versions and the vcpkg tool. The prune script
        # decides which archives a saved cache keeps, so a change to it starts a new key.
        vcpkg_rev=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD:vcpkg)
        echo "path=$dir" >> "$GITHUB_OUTPUT"
        echo "key=vcpkg-bin-${RUNNER_OS}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**', 'vcpkg-overlays/**', 'scripts/prune-vcpkg-bincache.py') }}-${vcpkg_rev}" >> "$GITHUB_OUTPUT"
        echo "prefix=vcpkg-bin-${RUNNER_OS}-" >> "$GITHUB_OUTPUT"
        echo "VCPKG_BINARY_SOURCES=clear;files,$dir,readwrite" >> "$GITHUB_ENV"
    - name: Restore vcpkg binary cache
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.vars.outputs.path }}
        key: ${{ steps.vars.outputs.key }}
        # A partial match still helps: vcpkg builds only the ports it does not find. The ports of
        # an unfinished install of this same key come first, then the latest other key.
        restore-keys: |
          ${{ steps.vars.outputs.key }}-partial-
          ${{ steps.vars.outputs.prefix }}
