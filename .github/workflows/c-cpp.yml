name: C/C++ CI

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]

# A new push to a PR supersedes the run in progress; master and tag runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # LibreDWG dwg2dxf (DWG support), built once from the signed GNU release for both
  # platforms (Windows: mingw-w64 cross build) so the binary that is tested is the
  # binary that ships. Cached on the pinned version and the build script.
  build_libredwg:
    name: Build LibreDWG dwg2dxf (Linux + Windows)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache dwg2dxf
        id: cache
        uses: actions/cache@v4
        with:
          path: libredwg-out
          key: libredwg-${{ hashFiles('scripts/libredwg-version', 'scripts/build-libredwg.sh') }}
      - name: Build dwg2dxf (native + mingw-w64 cross)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential mingw-w64 pkg-config xz-utils gpg curl
          export LIBREDWG_SOURCE_DIR=libredwg-out/source
          ./scripts/build-libredwg.sh libredwg-out/linux
          ./scripts/build-libredwg.sh libredwg-out/windows "" x86_64-w64-mingw32
      - name: Upload dwg2dxf
        uses: actions/upload-artifact@v4
        with:
          name: libredwg
          path: libredwg-out
          retention-days: 90
      - name: Attach LibreDWG Corresponding Source to Release
        # GPL-3.0 section 6: releases that ship dwg2dxf offer the exact source they were built from.
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: libredwg-out/source/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true

  build_ubuntu:
    name: Build/Test on Ubuntu
    needs: build_libredwg
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-linux-release
      PROJ_LIB: ${{ github.workspace }}/build
      PROJ_DATA: ${{ github.workspace }}/build
      VCPKG_BUILD_TYPE: release
      VCPKG_FEATURE_FLAGS: "binarycaching,manifests,versions"
      # build-lod is MANDATORY for gsplat builds: its absence fails the gsplat tests.
      DDB_REQUIRE_BUILDLOD: "1"
    steps:
      - name: Free Disk Space
        uses: ShubhamTatvamasi/free-disk-space-action@master
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Info
        run: |
          pwd
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_REPOSITORY=${GITHUB_REPOSITORY}"
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID}"
          echo "GITHUB_RUN_NUMBER=${GITHUB_RUN_NUMBER}"
          echo "GITHUB_SHA=${GITHUB_SHA}"
          ls -la
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-binary-cache
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-ubuntu
          max-size: 500M
      - name: Install Linux dependencies
        run: |
          chmod +x ./scripts/install-dependencies.sh
          ./scripts/install-dependencies.sh
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: vcpkg.json
          doNotCache: false
      - name: Run CMake
        id: configure
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            mkdir -p build
            cd build
            # Clean dist directory to avoid including old artifacts
            rm -rf dist/*.tgz
            mkdir -p dist
            cmake -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/vcpkg-triplets -DVCPKG_HOST_TRIPLET=x64-linux-release -DVCPKG_TARGET_TRIPLET=x64-linux-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake ..
      - name: Save vcpkg binary cache
        # Saved right after vcpkg install so a later build or test failure keeps the built ports.
        # An install that failed or was cancelled (a newer push supersedes a cold build) keeps
        # the ports built so far under a partial key, which the next run restores first.
        if: always() && steps.configure.outcome != 'skipped' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.key || steps.vcpkg-cache.outputs.partial-key }}
      - name: Build C++ lib/program and tests
        run: cd build && make -j$(nproc)
      - name: Build Untwine COPC accelerator
        # Optional on PR/master pushes (DroneDB falls back to PDAL writers.copc),
        # but MUST succeed on release tags so the .deb ships with untwine.
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          chmod +x ./scripts/build-untwine.sh
          ./scripts/build-untwine.sh build Release
      - name: Install Rust toolchain
        # Required to build the build-lod Gaussian Splat LOD producer (vendor/spark).
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Check vendor/spark tag pin (informational)
        # Repo policy pins vendor/spark to a release tag unless the commit was
        # explicitly reviewed (see CONTRIBUTING.md). Non-blocking (|| keeps exit 0).
        run: git -C vendor/spark describe --tags --exact-match >/dev/null 2>&1 || echo "::warning::vendor/spark is not on a release tag — repo policy pins spark to tags unless the commit is explicitly reviewed (see CONTRIBUTING.md 'Bumping vendor/spz and vendor/spark')"
      - name: Build build-lod (Gaussian Splat LOD producer)
        # build-lod is a MANDATORY dependency of Gaussian Splat builds:
        # the DDB_REQUIRE_BUILDLOD env makes missing tooling fail the gsplat tests.
        run: |
          chmod +x ./scripts/build-buildlod.sh
          ./scripts/build-buildlod.sh build Release
      - name: Download Obj2Tiles (OGC 3D Tiles generator)
        # Optional on PR/master pushes (3D Tiles generation disabled, Nexus still
        # produced), but MUST succeed on release tags so the .deb ships with Obj2Tiles.
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          chmod +x ./scripts/download-obj2tiles.sh
          ./scripts/download-obj2tiles.sh build
      - name: Get dwg2dxf (DWG converter)
        # Optional on PR/master pushes (DWG builds fail with an actionable message),
        # but MUST succeed on release tags so the .deb ships with dwg2dxf.
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/download-artifact@v4
        with:
          name: libredwg
          path: libredwg-out
      - name: Install dwg2dxf next to ddbcmd
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          cp libredwg-out/linux/dwg2dxf libredwg-out/linux/dwg2dxf.LICENSE.txt build/
          chmod +x build/dwg2dxf
          build/dwg2dxf --version
      - name: Verify LibreDWG is not linked into libddb
        # dwg2dxf (GPL) is only ever run as a subprocess; libddb must not contain LibreDWG.
        run: |
          if nm -D --defined-only build/libddb.so | grep -E ' (dwg_|dxf_)[a-z_]+$' | grep -q .; then
            echo "::error::libddb.so exports LibreDWG symbols"; exit 1
          fi
      - name: Verify Spark RAD format pin
        run: |
          echo "Checking vendor/spark/rust/spark-lib/src/rad.rs against the reviewed pin..."
          sha256sum -c tests/data/spark-rad-format.sha256 || { echo "::error::rad.rs changed since the last verified pin: review encoding handling in src/library/rad.cpp, then refresh with: (cd $GITHUB_WORKSPACE && sha256sum vendor/spark/rust/spark-lib/src/rad.rs > tests/data/spark-rad-format.sha256)"; exit 1; }
      - name: Run C++ Tests
        env:
          # Real-converter tests skip when the binary is absent (non-tag builds).
          DDB_DWG2DXF_PATH: ${{ github.workspace }}/build/dwg2dxf
        run: cd build && ./ddbtest --gtest_shuffle
      - name: Run Program Smoke Test
        run: cd build && ./ddbcmd --debug
      - name: Build Debian Package
        run: |
          # Set DDB_VERSION env var for the package
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "DDB_VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          else
            # Use commit hash for non-tag builds
            echo "DDB_VERSION=$(git describe --always)" >> $GITHUB_ENV
          fi

          # Set VCPKG_HOST_TRIPLET for the build script
          echo "VCPKG_HOST_TRIPLET=${VCPKG_DEFAULT_TRIPLET}" >> $GITHUB_ENV

          # Clean dist and package directories to avoid including old artifacts
          rm -rf build/dist/*.tgz build/package/*.deb
          mkdir -p build/dist build/package

          # Verify required files exist in build directory
          for file in ddbcmd libddb.so libnxs.so proj.db timezone21.bin sensor_data.sqlite curl-ca-bundle.crt; do
            if [ ! -f "build/$file" ]; then
              echo "Error: Required file $file not found in build directory!"
              exit 1
            fi
          done

          # Execute the build script
          chmod +x scripts/build-debian-package.sh
          ./scripts/build-debian-package.sh

          # Test linting of Debian package
          echo "Running lintian on Debian package..."
          lintian ../ddb_*.deb || echo "Lintian reported issues, but continuing..."

          # Verify untwine packaging. Required on release tags, informational otherwise.
          echo "Checking whether untwine is included in the Debian package..."
          if dpkg -c build/package/ddb_*.deb | grep -E '/usr/bin/untwine$' >/dev/null; then
            echo "  ✓ untwine present in .deb (COPC accelerator enabled)"
          else
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "  ✗ untwine NOT present in .deb - release builds MUST include untwine. Failing."
              exit 1
            else
              echo "  ! untwine NOT present in .deb (DroneDB will fall back to PDAL writers.copc)"
            fi
          fi

          # Verify build-lod packaging. Required on release tags, informational otherwise.
          echo "Checking whether build-lod is included in the Debian package..."
          if dpkg -c build/package/ddb_*.deb | grep -E '/usr/bin/build-lod$' >/dev/null; then
            echo "  ✓ build-lod present in .deb (Gaussian Splat LOD streaming enabled)"
          else
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "  ✗ build-lod NOT present in .deb - release builds MUST include build-lod. Failing."
              exit 1
            else
              echo "  ! build-lod NOT present in .deb (Gaussian Splat builds deferred until build-lod is available)"
            fi
          fi

          # Verify Obj2Tiles packaging. Required on release tags, informational otherwise.
          echo "Checking whether Obj2Tiles is included in the Debian package..."
          if dpkg -c build/package/ddb_*.deb | grep -E '/usr/bin/Obj2Tiles$' >/dev/null; then
            echo "  ✓ Obj2Tiles present in .deb (OGC 3D Tiles generation enabled)"
          else
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "  ✗ Obj2Tiles NOT present in .deb - release builds MUST include Obj2Tiles. Failing."
              exit 1
            else
              echo "  ! Obj2Tiles NOT present in .deb (3D Tiles generation disabled, Nexus still produced)"
            fi
          fi

          # Verify dwg2dxf packaging. Required on release tags, informational otherwise.
          echo "Checking whether dwg2dxf is included in the Debian package..."
          if dpkg -c build/package/ddb_*.deb | grep -E '/usr/bin/dwg2dxf$' >/dev/null; then
            echo "  ✓ dwg2dxf present in .deb (DWG support enabled)"
          else
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "  ✗ dwg2dxf NOT present in .deb - release builds MUST include dwg2dxf. Failing."
              exit 1
            else
              echo "  ! dwg2dxf NOT present in .deb (DWG builds fail with an actionable message)"
            fi
          fi

          # Verify PDAL plugin packaging. PDAL >= 19 loads plugins by
          # unversioned soname from the loader path (the directory holding
          # libpdalcpp); without unversioned copies in /usr/lib every E57
          # fails with "Cannot create reader stage readers.e57". This
          # regressed silently for months, so it fails the build outright.
          echo "Checking PDAL plugin packaging..."
          if ! dpkg -c build/package/ddb_*.deb | grep -E '/usr/lib/libpdal_plugin_reader_e57\.so$' >/dev/null; then
            echo "  ✗ unversioned libpdal_plugin_reader_e57.so missing from /usr/lib - E57 indexing would be dead. Failing."
            exit 1
          fi
          if ! dpkg -c build/package/ddb_*.deb | grep -E '/usr/lib/pdal/plugins/libpdal_plugin_' >/dev/null; then
            echo "  ✗ versioned PDAL plugins missing from /usr/lib/pdal/plugins. Failing."
            exit 1
          fi
          echo "  ✓ PDAL plugin layout OK (unversioned next to libpdalcpp + versioned under /usr/lib/pdal/plugins)"

          # Functional smoke test: install the .deb in a clean Ubuntu 24.04
          # (same base image as the dronedb/registry runtime image) and
          # really index an E57. A build-tree-side test cannot catch this
          # class of bug: the packaged binaries' RUNPATH points into the
          # build tree, so from a checkout the loader would silently prefer
          # the build-tree plugins even when the package ships a broken
          # layout. In a clean container the only candidate is /usr/lib,
          # exactly as in the Registry containers.
          echo "Running E57 package smoke test in clean ubuntu:24.04..."
          docker run --rm \
            -v "$GITHUB_WORKSPACE/build/package:/pkg:ro" \
            ubuntu:24.04 bash -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq /pkg/ddb_*.deb curl ca-certificates >/dev/null
              mkdir -p /tmp/e57smoke && cd /tmp/e57smoke
              ddb --version
              curl -fsSL --retry 3 -o a4.e57 https://github.com/DroneDB/test_data/raw/refs/heads/master/point-clouds/A4.e57
              ddb init . > /dev/null
              ddb add a4.e57
              ddb list | grep -q "a4\.e57"
              ddb info a4.e57 --format json | grep -qE "\"pointCount\":[1-9]"
              echo "  ✓ packaged ddb indexed an E57 file in a clean Ubuntu 24.04"
              if [ -x /usr/bin/dwg2dxf ]; then
                mkdir -p /tmp/dwgsmoke && cd /tmp/dwgsmoke
                base=https://github.com/DroneDB/test_data/raw/refs/heads/master/vector/autocad
                curl -fsSL --retry 3 -o site.dwg $base/utm32n_site_dwg.dwg
                curl -fsSL --retry 3 -o site.prj $base/utm32n_site_dwg.prj
                ddb init . > /dev/null
                ddb add site.dwg site.prj
                ddb build site.dwg
                find .ddb/build -path "*vec/source.gpkg" | grep -q .
                find .ddb/build -path "*mvt/metadata.json" | grep -q .
                echo "  ✓ packaged ddb built a DWG with the packaged dwg2dxf in a clean Ubuntu 24.04"
              fi
            ' || {
              echo "  ✗ E57 package smoke test failed - the installed package cannot index E57 (PDAL plugins?)."
              exit 1
            }
      - name: Upload Distribution Files
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Binaries
          path: |
            build/package/*.deb
          retention-days: 90
      - name: Upload Debian Package to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/package/*.deb
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true

  # The dronedb/dronedb image installs the .deb that build_ubuntu just tested, so the
  # binary that ships is the binary that was tested and nothing is compiled twice.
  docker_image:
    name: Docker Image
    needs: build_ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get Debian package
        uses: actions/download-artifact@v4
        with:
          name: Linux-Binaries
          path: ${{ runner.temp }}/ddb-package
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dronedb/dronedb
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: runtime
          # Replaces the source-build "package" stage with the tested .deb.
          build-contexts: package=${{ runner.temp }}/ddb-package
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test Docker image
        run: docker run --rm "${{ fromJSON(steps.meta.outputs.json).tags[0] }}" --version
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          target: runtime
          build-contexts: package=${{ runner.temp }}/ddb-package
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build_windows:
    name: Build/Test on Windows
    needs: build_libredwg
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows-release
      VCPKG_BUILD_TYPE: release
      PROJ_LIB: ${{ github.workspace }}/build
      PROJ_DATA: ${{ github.workspace }}/build
      VCPKG_FEATURE_FLAGS: "binarycaching,manifests,versions"
      VCPKG_KEEP_ENV_VARS: "CMAKE_C_CLANG_TIDY;CMAKE_CXX_CLANG_TIDY"
      CMAKE_C_CLANG_TIDY: ""
      CMAKE_CXX_CLANG_TIDY: ""
      # build-lod is MANDATORY for gsplat builds: its absence fails the gsplat tests.
      DDB_REQUIRE_BUILDLOD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-binary-cache
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: vcpkg.json
          doNotCache: false
      - name: Run CMake
        id: configure
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 30
          shell: pwsh
          command: |
            $ErrorActionPreference = 'Stop'
            if (!(Test-Path build)) { New-Item -ItemType Directory -Path build }
            cd build
            cmake .. -DVCPKG_HOST_TRIPLET=x64-windows-release -DVCPKG_TARGET_TRIPLET=x64-windows-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
            if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed with exit code $LASTEXITCODE" }
      - name: Save vcpkg binary cache
        # Saved right after vcpkg install so a later build or test failure keeps the built ports.
        # An install that failed or was cancelled (a newer push supersedes a cold build) keeps
        # the ports built so far under a partial key, which the next run restores first.
        if: always() && steps.configure.outcome != 'skipped' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.configure.outcome == 'success' && steps.vcpkg-cache.outputs.key || steps.vcpkg-cache.outputs.partial-key }}
      - name: Build C++ lib/program and tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 30
          shell: pwsh
          command: |
            $ErrorActionPreference = 'Stop'
            cd build
            cmake --build . --config Release --target ALL_BUILD -- /maxcpucount:$env:NUMBER_OF_PROCESSORS
            if ($LASTEXITCODE -ne 0) { throw "Build failed with exit code $LASTEXITCODE" }
            dir
      - name: Build Untwine COPC accelerator
        # Optional on PR/master pushes (DroneDB falls back to PDAL writers.copc),
        # but MUST succeed on release tags so the zip ships with untwine.exe.
        # Uses Ninja (default) to avoid VS 2025 clang-tidy co-compilation errors
        # with third-party vcpkg dependencies (e.g. h3 library).
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: .\scripts\build-untwine.ps1 -BuildDir build -Config Release
      - name: Install Rust toolchain
        # Required to build the build-lod Gaussian Splat LOD producer (vendor/spark).
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Build build-lod (Gaussian Splat LOD producer)
        # build-lod is a MANDATORY dependency of Gaussian Splat builds:
        # the DDB_REQUIRE_BUILDLOD env makes missing tooling fail the gsplat tests.
        shell: pwsh
        run: .\scripts\build-buildlod.ps1 -BuildDir build -Config Release
      - name: Download Obj2Tiles (OGC 3D Tiles generator)
        # Optional on PR/master pushes (3D Tiles generation disabled, Nexus still
        # produced), but MUST succeed on release tags so the zip ships with Obj2Tiles.exe.
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: .\scripts\download-obj2tiles.ps1 -TargetDir build
      - name: Get dwg2dxf.exe (DWG converter)
        # Optional on PR/master pushes, but MUST succeed on release tags so the zip
        # ships with dwg2dxf.exe (cross-compiled by build_libredwg).
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/download-artifact@v4
        with:
          name: libredwg
          path: libredwg-out
      - name: Install dwg2dxf.exe next to ddbcmd.exe
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          Copy-Item libredwg-out/windows/dwg2dxf.exe, libredwg-out/windows/dwg2dxf.LICENSE.txt build/ -Force
          & build/dwg2dxf.exe --version
      - name: Enable crash dumps for ddbtest
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\ddbtest.exe'
          New-Item -Path $key -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpFolder -PropertyType ExpandString -Value "$env:RUNNER_TEMP\ddbtest-dumps" -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpType -PropertyType DWord -Value 1 -Force | Out-Null
          New-ItemProperty -Path $key -Name DumpCount -PropertyType DWord -Value 3 -Force | Out-Null
      - name: Run C++ Tests
        env:
          DDB_DWG2DXF_PATH: ${{ github.workspace }}\build\dwg2dxf.exe
          # The crash report resolves GDAL/GEOS frames from vcpkg's PDBs
          _NT_SYMBOL_PATH: ${{ github.workspace }}\build\vcpkg_installed\x64-windows-release\bin
        run: |
          cd build
          .\ddbtest.exe --gtest_shuffle
          $code = $LASTEXITCODE
          # The pwsh step wrapper turns a negative (NTSTATUS) exit code into 1: print the real one
          "ddbtest exit code: $code (0x{0:X8})" -f $code
          exit [int]($code -ne 0)
        shell: pwsh
      - name: Upload ddbtest crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ddbtest-crash-dumps
          path: |
            ${{ runner.temp }}/ddbtest-dumps
            build/*.pdb
            build/vcpkg_installed/x64-windows-release/bin/gdal*.pdb
            build/vcpkg_installed/x64-windows-release/bin/geos*.pdb
          if-no-files-found: ignore
          retention-days: 14
      - name: Run Program Smoke Test
        run: cd build && .\ddbcmd.exe --version --debug
        shell: pwsh
      - name: Create Distribution Files
        shell: pwsh
        run: |
          # Extract version from package.json
          $packageJson = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $packageJson.version
          Write-Host "Creating Windows package for version: $version"

          # Clean dist directory to avoid including old artifacts
          if (Test-Path "build/dist") { Remove-Item -Recurse -Force "build/dist" }

          # Run the packaging script
          .\scripts\build-windows-package.ps1 -BuildDir "build" -Version $version

          # Verify package was created
          Write-Host "`nVerifying package:"
          Get-ChildItem build/dist/*.zip | ForEach-Object {
            Write-Host "  Package: $($_.Name) ($([Math]::Round($_.Length / 1MB, 2)) MB)"
          }

          # Verify untwine packaging. Required on release tags, informational otherwise.
          $zipCheckDir = Join-Path $env:RUNNER_TEMP 'ddb-zip-check'
          if (Test-Path $zipCheckDir) { Remove-Item -Recurse -Force $zipCheckDir }
          $zipFile = Get-ChildItem build/dist/*.zip | Select-Object -First 1
          if ($zipFile) {
            Expand-Archive $zipFile.FullName -DestinationPath $zipCheckDir -Force
            if (Test-Path (Join-Path $zipCheckDir 'untwine.exe')) {
              Write-Host '  ✓ untwine.exe present in zip (COPC accelerator enabled)'
            } else {
              if ($env:GITHUB_REF -like 'refs/tags/v*') {
                Write-Host '  ✗ untwine.exe NOT present in zip - release builds MUST include untwine. Failing.'
                exit 1
              } else {
                Write-Host '  ! untwine.exe NOT present in zip (DroneDB will fall back to PDAL writers.copc)'
              }
            }
            if (Test-Path (Join-Path $zipCheckDir 'Obj2Tiles.exe')) {
              Write-Host '  ✓ Obj2Tiles.exe present in zip (OGC 3D Tiles generation enabled)'
            } else {
              if ($env:GITHUB_REF -like 'refs/tags/v*') {
                Write-Host '  ✗ Obj2Tiles.exe NOT present in zip - release builds MUST include Obj2Tiles. Failing.'
                exit 1
              } else {
                Write-Host '  ! Obj2Tiles.exe NOT present in zip (3D Tiles generation disabled, Nexus still produced)'
              }
            }
            if (Test-Path (Join-Path $zipCheckDir 'build-lod.exe')) {
              Write-Host '  ✓ build-lod.exe present in zip (Gaussian Splat LOD generation enabled)'
            } else {
              if ($env:GITHUB_REF -like 'refs/tags/v*') {
                Write-Host '  ✗ build-lod.exe NOT present in zip - release builds MUST include build-lod. Failing.'
                exit 1
              } else {
                Write-Host '  ! build-lod.exe NOT present in zip (Gaussian Splat builds will be deferred until build-lod is available)'
              }
            }
            if (Test-Path (Join-Path $zipCheckDir 'dwg2dxf.exe')) {
              Write-Host '  ✓ dwg2dxf.exe present in zip (DWG support enabled)'
              # Smoke test with only the zip contents and System32 on PATH: proves the
              # converter needs no DLL we do not ship, on a real Windows host.
              $savedPath = $env:PATH
              $env:PATH = "$zipCheckDir;$env:SystemRoot\System32"
              try {
                & (Join-Path $zipCheckDir 'dwg2dxf.exe') --version
                if ($LASTEXITCODE -ne 0) { throw "dwg2dxf.exe --version failed ($LASTEXITCODE)" }
                $smoke = Join-Path $env:RUNNER_TEMP 'dwg-smoke'
                New-Item -ItemType Directory -Force -Path $smoke | Out-Null
                $base = 'https://github.com/DroneDB/test_data/raw/refs/heads/master/vector/autocad'
                Invoke-WebRequest "$base/utm32n_site_dwg.dwg" -OutFile (Join-Path $smoke 'site.dwg')
                Invoke-WebRequest "$base/utm32n_site_dwg.prj" -OutFile (Join-Path $smoke 'site.prj')
                Push-Location $smoke
                $ddb = Join-Path $zipCheckDir 'ddbcmd.exe'
                & $ddb init . | Out-Null
                & $ddb add site.dwg site.prj | Out-Null
                & $ddb build site.dwg
                if ($LASTEXITCODE -ne 0) { throw "ddbcmd build of a DWG failed ($LASTEXITCODE)" }
                if (-not (Get-ChildItem -Recurse .ddb/build -Filter source.gpkg)) { throw "no vec/source.gpkg produced" }
                Pop-Location
                Write-Host '  ✓ packaged ddbcmd.exe built a DWG with the packaged dwg2dxf.exe'
              } finally {
                $env:PATH = $savedPath
              }
            } else {
              if ($env:GITHUB_REF -like 'refs/tags/v*') {
                Write-Host '  ✗ dwg2dxf.exe NOT present in zip - release builds MUST include dwg2dxf. Failing.'
                exit 1
              } else {
                Write-Host '  ! dwg2dxf.exe NOT present in zip (DWG builds fail with an actionable message)'
              }
            }
          }
      - name: Upload Distribution Files
        uses: actions/upload-artifact@v4
        with:
          name: Windows Binaries
          path: build/dist/*.zip
      - name: Upload Binaries to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: build/dist/*.zip
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true

